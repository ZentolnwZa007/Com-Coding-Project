<div class = "Window" id="homePage">
    <h1>Home</h1>
    <button onclick="ShowWindow('mainPage')">Go to Main</button>
</div>

<div class = "Window" id="mainPage" style="display: none;">
    <h1>Main Page</h1>
    <button onclick="ShowWindow('homePage')">Back</button>
</div>

<script>

    function ShowWindow(WindowName) {
    let Windows = document.querySelectorAll(".Window");

    for (let Window of Windows) {
        if (Window.id === WindowName) {
            Window.style.display = "block";
        } else {
            Window.style.display = "none";
        }
    };
}

</script>
